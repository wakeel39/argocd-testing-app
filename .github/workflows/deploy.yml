name: Build and Push

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # 1) First: clone helm-chart repo and update values with new image tag
      - name: Clone helm-chart repo and set image tag
        env:
          HELM_CHART_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          mkdir -p devops
          git clone https://x-access-token:${HELM_CHART_TOKEN}@github.com/wakeel39/helm-chart.git devops/helm-chart
          sed -i "s/^  tag: .*/  tag: ${{ steps.version.outputs.VERSION }}/" devops/helm-chart/values.yaml
          ls -la devops/helm-chart/
          grep "tag:" devops/helm-chart/values.yaml
          ls -la devops/

      # 2) Then: build and push image to Docker (helm-chart already has updated tag in values)
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t sardarabdulwakeel/argocdnodejsapp:${{ steps.version.outputs.VERSION }} -t sardarabdulwakeel/argocdnodejsapp:latest .
          docker push sardarabdulwakeel/argocdnodejsapp:${{ steps.version.outputs.VERSION }}
          docker push sardarabdulwakeel/argocdnodejsapp:latest

      # devops/helm-chart is temp only — never committed or pushed to the repo
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/

      # - name: Argo CD sync
      #   env:
      #     ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      #     ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
      #     ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
      #     ARGOCD_APP_NAME: ${{ secrets.ARGOCD_APP_NAME }}
      #   run: |
      #     argocd login $ARGOCD_SERVER --username "$ARGOCD_USERNAME" --password "$ARGOCD_PASSWORD" --insecure
      #     argocd app sync "$ARGOCD_APP_NAME" --local-repo-root "$GITHUB_WORKSPACE/deploy/devops" --local helm-chart --force
      #     argocd app wait "$ARGOCD_APP_NAME" --health --timeout 300
      #     argocd app get "$ARGOCD_APP_NAME" --show-operation

      # Commit devops only for the tag (do not push to master — temp folder lives only in the tagged commit)
      - name: Commit devops for release tag only
        run: |
          rm -rf devops/helm-chart/.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add devops/
          git commit -m "chore: devops snapshot for release v${{ steps.version.outputs.VERSION }}"
          # Do not push master — only the tag will be pushed, so this commit exists only at the tag

      # Push only the tag (commit with devops/ is sent as the tag target); master is never pushed
      - name: Create and push release tag only
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      # Zip source (exclude .git, node_modules, devops) for artifact and release
      - name: Archive source code
        run: zip -r release-source.zip . -x '.git/*' -x 'node_modules/*' -x 'devops/*' -x '*.zip'

      # Upload source zip as workflow artifact (download from Actions → Summary → Artifacts)
      - name: Upload source code artifact
        uses: actions/upload-artifact@v4
        with:
          name: argocdnodejsapp-source-v${{ steps.version.outputs.VERSION }}
          path: release-source.zip
          retention-days: 90

      # Create GitHub Release and attach source zip (Releases page)
      - name: Create Release and upload source
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: release-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temp folder
        run: rm -rf devops
